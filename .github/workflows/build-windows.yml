name: Build Windows EXE

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add Windows platform
        run: flutter create --platforms=windows --project-name wc_khata --org com.webdsoft .

      - name: App icon
        run: |
          python -m pip install pillow
          python tools/make_ico.py

      - run: flutter pub get
      - run: flutter build windows --release

      - name: Build installer (Setup.exe)
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_installer\installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: WC_Khata_Setup
          path: installer_out/WC_Khata_Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: WC_Khata_Portable_Folder
          path: build/windows/x64/runner/Release
