name: Build Windows EXE

on:
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add Windows platform
        run: flutter create --platforms=windows --project-name wc_khata --org com.webdsoft .

      - name: Unpack WC Khata project over it
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Filter "WC_Khata*.zip" | Select-Object -First 1
          if (-not $zip) { throw "Repo mein WC_Khata wali zip nahi mili" }
          Write-Host "Using zip: $($zip.Name)"
          Expand-Archive -Path $zip.FullName -DestinationPath unpacked -Force
          Copy-Item -Path unpacked\WC_Khata\* -Destination . -Recurse -Force
          Remove-Item -Recurse -Force unpacked
          if (Test-Path test) { Remove-Item -Recurse -Force test }
          Get-Content lib\main.dart -TotalCount 5

      - name: App icon (skipped if it fails)
        continue-on-error: true
        run: |
          python -m pip install pillow
          python -c "from PIL import Image; Image.open('assets/icons/app_icon.png').convert('RGBA').save('windows/runner/resources/app_icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"

      - name: Get packages
        run: flutter pub get

      - name: Build Windows release
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release

      - name: Build installer (Setup.exe)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows_installer | Out-Null
          $iss = @(
            '[Setup]',
            'AppName=WC Khata',
            'AppVersion=1.0.9',
            'AppPublisher=webdsoft',
            'DefaultDirName={autopf}\WC Khata',
            'DefaultGroupName=WC Khata',
            'OutputDir=..\installer_out',
            'OutputBaseFilename=WC_Khata_Setup',
            'Compression=lzma2',
            'SolidCompression=yes',
            'ArchitecturesInstallIn64BitMode=x64compatible',
            'DisableProgramGroupPage=yes',
            '',
            '[Files]',
            'Source: "..\build\windows\x64\runner\Release\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion',
            '',
            '[Icons]',
            'Name: "{group}\WC Khata"; Filename: "{app}\wc_khata.exe"',
            'Name: "{autodesktop}\WC Khata"; Filename: "{app}\wc_khata.exe"',
            '',
            '[Run]',
            'Filename: "{app}\wc_khata.exe"; Description: "Open WC Khata"; Flags: nowait postinstall skipifsilent'
          )
          $iss | Set-Content -Path windows_installer\installer.iss
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_installer\installer.iss

      - name: Upload Setup
        uses: actions/upload-artifact@v4
        with:
          name: WC_Khata_Setup
          path: installer_out/WC_Khata_Setup.exe
